title: Talon
description: >-
  An SMS voucher and cash-transfer platform for humanitarian programmes running where the
  banking layer is not available.

# GitHub Pages builds this site natively — "Settings > Pages > Deploy from a branch", with the
# folder set to /docs. There is no Actions workflow and no local toolchain to install.
#
# just-the-docs is pulled in with jekyll-remote-theme, which Pages supports, so the theme does not
# have to be vendored into the repository.
remote_theme: just-the-docs/just-the-docs

# Project pages are served from a subpath. Both values have to match the repository they are
# published from, or the stylesheet and every internal link resolves to the wrong place. Change them
# if you fork this.
url: https://reyrodrigues.github.io
baseurl: /TalonSMS

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Jekyll ignores a theme's own _config.yml, and that is where just-the-docs would otherwise declare
# its default layout. Without this every page renders as a bare HTML fragment — no navigation, no
# stylesheet — which builds without error and looks entirely broken.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# The repository holds application source alongside these pages; without an explicit include list
# Jekyll would try to render anything that looks like content.
exclude:
  - screenshots/README.md

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  View on GitHub:
    - https://github.com/reyrodrigues/TalonSMS
aux_links_new_tab: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  caution:
    title: Before you go live
    color: yellow

footer_content: >-
  Talon is free software under the terms in the repository's LICENSE. Originally built in 2015 at the
  International Rescue Committee; modernised and released publicly in 2026.
